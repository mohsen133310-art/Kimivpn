name: Build KimiVPN APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'strongswan/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: kimivpn-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.3.13750724

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Verify native prerequisites
        run: |
          test -f app/libs/gozarcore.aar
          for f in \
            strongswan/src/libstrongswan/asn1/oid.c \
            strongswan/src/libstrongswan/asn1/oid.h \
            strongswan/src/libstrongswan/crypto/proposal/proposal_keywords_static.c \
            strongswan/src/libstrongswan/crypto/proposal/proposal_keywords_static.h \
            strongswan/src/libstrongswan/settings/settings_parser.c \
            strongswan/src/libstrongswan/settings/settings_parser.h \
            strongswan/src/libstrongswan/settings/settings_lexer.c \
            strongswan/Android.common.mk \
            strongswan/src/frontends/android/app/src/main/jni/openssl/Android.mk
          do
            test -f "$f" || { echo "Missing generated source: $f"; exit 1; }
          done

      - name: Remove developer-local proxy settings
        run: |
          for f in gradle.properties gradle/gradle.properties gradle/gradle-daemon-jvm.properties; do
            if [ -f "$f" ]; then
              sed -i '/proxyHost/d; /proxyPort/d' "$f"
            fi
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          find app/build/outputs/apk/debug -name '*.apk' -exec cp {} dist/ \;
          ls -lh dist
          test -n "$(find dist -name '*.apk' -print -quit)"

      - name: Upload KimiVPN APKs
        uses: actions/upload-artifact@v4
        with:
          name: KimiVPN-debug-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
